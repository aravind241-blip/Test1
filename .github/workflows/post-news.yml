name: Auto Post Breaking News

on:
  schedule:
    # Runs every 3 hours. Once you're happy with results, change this to
    # "*/30 * * * *" to run every 30 minutes.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select article and generate image (phase 1)
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python scripts/select_and_generate.py

      - name: Commit and push generated image
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/images state/rotation.json state/pending_post.json
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Add generated image [skip ci]"
          git push

      - name: Publish to Instagram + Facebook (phase 2)
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python scripts/publish_post.py

      - name: Commit posted log
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/posted_log.json state/pending_post.json
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Update posted log [skip ci]"
          git push
